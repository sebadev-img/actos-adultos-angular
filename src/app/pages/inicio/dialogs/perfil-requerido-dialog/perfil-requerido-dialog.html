<h2 mat-dialog-title>Completá tu perfil</h2>

<mat-dialog-content>
  <div class="perfil-icon">
    <mat-icon>person_alert</mat-icon>
  </div>

  <p>Para poder postularte a un cargo primero tenés que completar tus datos de postulante.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cerrar()">Cancelar</button>

  <button mat-flat-button type="button" (click)="irAPostulante()">
    <mat-icon>person</mat-icon>
    Ir a Mi Perfil
  </button>
</mat-dialog-actions>
