<div class="login-dialog">
  <div class="dialog-icon">
    <mat-icon>lock</mat-icon>
  </div>

  <h2 mat-dialog-title>Inicio de sesión requerido</h2>

  <mat-dialog-content>
    <p>Para poder postularte a un cargo tenés que iniciar sesión con tu cuenta.</p>

    <p class="secondary-text">
      Si todavía no tenés una cuenta, podés registrarte desde la pantalla de inicio de sesión.
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false">Cancelar</button>

    <button mat-flat-button type="button" [mat-dialog-close]="true">
      <mat-icon>login</mat-icon>
      Iniciar sesión
    </button>
  </mat-dialog-actions>
</div>
